x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: "3"
      tag: '{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}'

services:
  aptos:
    image: ${DOCKER_REPO}:${DOCKER_TAG}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    pull_policy: always
    # The entrypoint renders /opt/aptos/run/fullnode.yaml from the sample on every start.
    # /tini is the image's own entrypoint and stays in front of it, so signals still reach
    # aptos-node
    entrypoint:
      - /tini
      - --
      - docker-entrypoint.sh
    command: aptos-node -f /opt/aptos/run/fullnode.yaml
    working_dir: /opt/aptos/etc
    restart: unless-stopped
    # AptosDB is a multi-hundred-GB RocksDB. The 10s Compose default SIGKILLs it mid-flush,
    # leaving recovery to the WAL on next start
    stop_grace_period: 5m
    environment:
      - LEDGER_PRUNER_ENABLED=${LEDGER_PRUNER_ENABLED:-false}
      - LEDGER_PRUNE_WINDOW=${LEDGER_PRUNE_WINDOW:-360000000}
    volumes:
      - ./aptos/${NETWORK}:/opt/aptos/etc
      - ./aptos/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - aptos-data:/opt/aptos/data
    ports:
      - ${P2P_PORT:-6182}:6182 # p2p
    <<: *logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.${RPC_HOST}.service=${RPC_HOST}
      - traefik.http.routers.${RPC_HOST}.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST}.rule=Host(`${RPC_HOST}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST}.tls.certresolver=letsencrypt
      - traefik.http.routers.${RPC_HOST}lb.service=${RPC_HOST}
      - traefik.http.routers.${RPC_HOST}lb.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST}lb.rule=Host(`${RPC_LB}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST}lb.tls.certresolver=letsencrypt
      - traefik.http.services.${RPC_HOST}.loadbalancer.server.port=8080

      - metrics.scrape=true
      - metrics.path=/metrics
      - metrics.port=9101
      - metrics.network=aptos-${NETWORK}

volumes:
  aptos-data:
