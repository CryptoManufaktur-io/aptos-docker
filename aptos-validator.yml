services:
  validator:
    image: "${VALIDATOR_IMAGE_REPO:-aptoslabs/validator}:${NETWORK:-mainnet}"
    volumes:
      - type: volume
        source: aptos-validator
        target: /opt/aptos/data
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/validator.yaml
        target: /opt/aptos/etc/validator.yaml
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/genesis.blob
        target: /opt/aptos/genesis/genesis.blob
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/waypoint.txt
        target: /opt/aptos/genesis/waypoint.txt
      - type: bind
        source: ./keys/validator-identity.yaml
        target: /opt/aptos/genesis/validator-identity.yaml
    command:
      ["/usr/local/bin/aptos-node", "-f", "/opt/aptos/etc/validator.yaml"]
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6180:6180"
      - "9101:9101"
  db-restore:
    profiles: ["tools"]
    image: "aptoslabs/tools:${NETWORK:-mainnet}"
    volumes:
      - type: volume
        source: aptos-validator
        target: /opt/aptos/data
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/backup.yaml
        target: /opt/aptos/etc/backup.yaml
    command:
      [
        "aptos",
        "node",
        "bootstrap-db",
        "--command-adapter-config",
        "/opt/aptos/etc/backup.yaml",
        "--target-db-dir",
        "/opt/aptos/data/db",
      ]
    restart: "no"

volumes:
  aptos-validator:
    name: aptos-validator
