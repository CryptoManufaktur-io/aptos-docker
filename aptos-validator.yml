
services:
  haproxy:
    image: haproxy:3.0.2
    volumes:
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/blocked.ips
        target: /usr/local/etc/haproxy/blocked.ips
    networks:
      - shared
    expose:
      # Validator network
      - 6180
      # VFN to access to validators
      - 6181
      # Validator Metrics
      - 9101
      # Haproxy internal stats
      - 9102
      # Disable access to rest API port 80 for validator by default
      # - 8180
    ports:
      # Expose these to the outside
      - "6180:6180"
      - "6181:6181"
      # Preface these with 127 to only expose them locally
      - "127.0.0.1:9101:9101"
      - "127.0.0.1:9102:9102"
      # Disable access to rest API port 80 for validator by default
      # - 8180:8180


  validator:
    image: "${DOCKER_REPO:-aptoslabs/validator}:${DOCKER_TAG:-testnet}"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    networks:
      shared:
    volumes:
      - type: volume
        source: aptos-validator
        target: /opt/aptos/data
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/validator.yaml
        target: /opt/aptos/etc/validator.yaml
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/genesis.blob
        target: /opt/aptos/genesis/genesis.blob
      - type: bind
        source: ./aptos/${NETWORK:-mainnet}/waypoint.txt
        target: /opt/aptos/genesis/waypoint.txt
      - type: bind
        source: ./keys/validator-identity.yaml
        target: /opt/aptos/genesis/validator-identity.yaml
    command: ["/usr/local/bin/aptos-node", "-f", "/opt/aptos/etc/validator.yaml"]
    restart: unless-stopped
    expose:
      # These are only exposed on the docker internal network
      # Validator network
      - 6180
      # Fullnode access to validators
      - 6181
      # Validator Metrics
      - 9101
      # Disable access to rest API port 80 for validator by default
      # - 8080
    labels:
      - metrics.scrape=true
      - metrics.path=/metrics
      - metrics.port=9101
      - metrics.network=aptos-${NETWORK}

networks:
  shared:
    name: "aptos-docker-compose-shared"
    ipam:
      config:
        - subnet: 172.16.1.0/24

volumes:
  aptos-validator:
    name: aptos-validator
